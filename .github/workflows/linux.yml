name: Linux RDP

on:
  workflow_dispatch:

jobs:
  linux-rdp:
    runs-on: ubuntu-latest
    timeout-minutes: 3600

    steps:
      - name: Install XFCE and XRDP
        run: |
          sudo apt update

          sudo DEBIAN_FRONTEND=noninteractive apt install -y \
            xfce4 \
            xfce4-goodies \
            xfce4-session \
            xrdp \
            xorgxrdp \
            dbus-x11

          # Allow XRDP to access its certificates
          sudo adduser xrdp ssl-cert || true

          # Configure XRDP to start XFCE
          sudo tee /etc/xrdp/startwm.sh > /dev/null <<'EOF'
          #!/bin/sh

          export XDG_CONFIG_DIRS=/etc/xdg/xdg-xfce:/etc/xdg:/etc/xdg
          export XDG_DATA_DIRS=/usr/share/xfce4:/usr/local/share:/usr/share

          unset DBUS_SESSION_BUS_ADDRESS
          unset XDG_RUNTIME_DIR

          exec dbus-run-session -- startxfce4
          EOF

          sudo chmod +x /etc/xrdp/startwm.sh

          # Configure XRDP to use Xorg
          sudo sed -i 's/^port=.*/port=3389/' /etc/xrdp/xrdp.ini

          # Enable and restart XRDP
          sudo systemctl enable xrdp
          sudo systemctl restart xrdp
          sudo systemctl restart xrdp-sesman

          sleep 5

          echo "=== XRDP STATUS ==="
          sudo systemctl status xrdp --no-pager || true

          echo "=== XRDP SESMAN STATUS ==="
          sudo systemctl status xrdp-sesman --no-pager || true

          echo "=== PORT 3389 ==="
          sudo ss -lntp | grep 3389 || true

      - name: Create RDP User
        run: |
          PASSWORD=$(openssl rand -base64 18)

          # Create user
          sudo useradd -m -s /bin/bash RDP

          # Set password
          echo "RDP:$PASSWORD" | sudo chpasswd

          # Add sudo access
          sudo usermod -aG sudo RDP

          # Create XFCE session file
          sudo tee /home/RDP/.xsession > /dev/null <<'EOF'
          #!/bin/sh
          exec dbus-run-session -- startxfce4
          EOF

          sudo chown RDP:RDP /home/RDP/.xsession
          sudo chmod +x /home/RDP/.xsession

          # Make sure the home directory has correct ownership
          sudo chown -R RDP:RDP /home/RDP

          echo "RDP_PASSWORD=$PASSWORD" >> "$GITHUB_ENV"

          # Verify user
          if ! id RDP >/dev/null 2>&1; then
            echo "Failed to create RDP user."
            exit 1
          fi

          echo "RDP user created successfully."

      - name: Install Tailscale
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh

          if ! command -v tailscale >/dev/null 2>&1; then
            echo "Tailscale installation failed."
            exit 1
          fi

          echo "Tailscale installed."

      - name: Connect Tailscale
        run: |
          sudo tailscale up \
            --auth-key=${{ secrets.TAILSCALE_AUTH_KEY }} \
            --hostname=gh-linux-rdp-$GITHUB_RUN_ID

          TSIP=""

          for i in {1..20}; do
            TSIP=$(sudo tailscale ip -4 2>/dev/null | head -n1)

            if [ -n "$TSIP" ]; then
              break
            fi

            echo "Waiting for Tailscale IP..."
            sleep 3
          done

          if [ -z "$TSIP" ]; then
            echo "Tailscale IP was not assigned."
            exit 1
          fi

          echo "TAILSCALE_IP=$TSIP" >> "$GITHUB_ENV"

          echo "Tailscale IP: $TSIP"

      - name: Configure Firewall
        run: |
          # Allow RDP
          sudo ufw allow 3389/tcp 2>/dev/null || true

          # Restart XRDP after firewall configuration
          sudo systemctl restart xrdp
          sudo systemctl restart xrdp-sesman

          sleep 3

          echo "=== XRDP STATUS ==="
          sudo systemctl is-active xrdp

          echo "=== LISTENING PORTS ==="
          sudo ss -lntp | grep 3389 || true

      - name: Verify RDP
        run: |
          echo "Testing RDP port..."

          if timeout 5 bash -c '</dev/tcp/127.0.0.1/3389' 2>/dev/null; then
            echo "RDP port 3389 is OPEN."
          else
            echo "RDP port 3389 is NOT accessible."

            echo "=== XRDP STATUS ==="
            sudo systemctl status xrdp --no-pager || true

            echo "=== XRDP SESMAN STATUS ==="
            sudo systemctl status xrdp-sesman --no-pager || true

            echo "=== XRDP LOG ==="
            sudo tail -100 /var/log/xrdp.log || true

            echo "=== SESMAN LOG ==="
            sudo tail -100 /var/log/xrdp-sesman.log || true

            exit 1
          fi

      - name: Show RDP Information
        run: |
          echo ""
          echo "=========================================="
          echo "            LINUX RDP ACCESS"
          echo "=========================================="
          echo "Address:  $TAILSCALE_IP"
          echo "Port:     3389"
          echo "Username: RDP"
          echo "Password: $RDP_PASSWORD"
          echo "Desktop:  XFCE"
          echo "=========================================="
          echo ""
          echo "Use an RDP client and connect to:"
          echo "$TAILSCALE_IP:3389"
          echo ""
          echo "=========================================="

      - name: Maintain Connection
        run: |
          while true; do
            echo "[$(date)] Linux RDP active"
            sleep 300
          done

      - name: Show XRDP Logs
        if: always()
        run: |
          echo ""
          echo "=========================================="
          echo "              XRDP LOGS"
          echo "=========================================="

          echo ""
          echo "=== XRDP SERVICE ==="
          sudo systemctl status xrdp --no-pager || true

          echo ""
          echo "=== XRDP SESMAN ==="
          sudo systemctl status xrdp-sesman --no-pager || true

          echo ""
          echo "=== XRDP LOG ==="
          sudo tail -100 /var/log/xrdp.log || true

          echo ""
          echo "=== SESMAN LOG ==="
          sudo tail -100 /var/log/xrdp-sesman.log || true

          echo ""
          echo "=== RDP PORT ==="
          sudo ss -lntp | grep 3389 || true
