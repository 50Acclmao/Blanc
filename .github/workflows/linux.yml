name: Linux RDP

on:
  workflow_dispatch:

jobs:
  linux-rdp:
    runs-on: ubuntu-latest
    timeout-minutes: 3600

    steps:
      - name: Install XFCE and XRDP
        run: |
          sudo apt update
          sudo DEBIAN_FRONTEND=noninteractive apt install -y \
            xfce4 \
            xfce4-goodies \
            xrdp \
            dbus-x11

          sudo systemctl enable xrdp
          sudo systemctl restart xrdp

      - name: Create RDP User
        run: |
          PASSWORD=$(openssl rand -base64 18)

          sudo useradd -m -s /bin/bash RDP
          echo "RDP:$PASSWORD" | sudo chpasswd

          echo "xfce4-session" | sudo tee /home/RDP/.xsession
          sudo chown RDP:RDP /home/RDP/.xsession

          echo "RDP_PASSWORD=$PASSWORD" >> "$GITHUB_ENV"

      - name: Install Tailscale
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh

      - name: Connect Tailscale
        run: |
          sudo tailscale up \
            --auth-key=${{ secrets.TAILSCALE_AUTH_KEY }} \
            --hostname=gh-linux-rdp-$GITHUB_RUN_ID

          for i in {1..20}; do
            TSIP=$(tailscale ip -4 2>/dev/null | head -n1)

            if [ -n "$TSIP" ]; then
              break
            fi

            sleep 3
          done

          if [ -z "$TSIP" ]; then
            echo "Tailscale IP not found"
            exit 1
          fi

          echo "TAILSCALE_IP=$TSIP" >> "$GITHUB_ENV"

      - name: Show RDP Information
        run: |
          echo ""
          echo "=========================================="
          echo "             LINUX RDP ACCESS"
          echo "=========================================="
          echo "Address:  $TAILSCALE_IP"
          echo "Username: RDP"
          echo "Password: $RDP_PASSWORD"
          echo "Desktop:  XFCE"
          echo "=========================================="
          echo ""

      - name: Keep RDP Alive
        run: |
          while true; do
            echo "[$(date)] Linux RDP is active"
            sleep 300
          done
