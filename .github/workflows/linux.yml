name: RDP-Linux-1

on:
  workflow_dispatch:
    inputs:
      deadline:
        description: "Leave empty. Used by auto-restart to keep the 24h deadline"
        required: false
        default: ""

permissions:
  actions: write
  contents: read

jobs:
  secure-rdp:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Set 24h Deadline
        run: |
          DEADLINE="${{ github.event.inputs.deadline }}"

          if [ -z "$DEADLINE" ]; then
            DEADLINE=$(( $(date +%s) + 86400 ))
          fi

          echo "DEADLINE=$DEADLINE" >> "$GITHUB_ENV"
          echo "Session deadline: $(date -u -d @$DEADLINE)"

      - name: Install Desktop + xrdp
        run: |
          sudo apt-get update
          sudo apt-get install -y xfce4 xfce4-goodies xrdp dbus-x11

          echo "xfce4-session" > ~/.xsession
          sudo systemctl enable xrdp
          sudo systemctl restart xrdp

          echo "Desktop and xrdp installed."

      - name: Create RDP User with Secure Password
        run: |
          UPPER=$(tr -dc 'A-Z' < /dev/urandom 2>/dev/null | head -c4)
          LOWER=$(tr -dc 'a-z' < /dev/urandom 2>/dev/null | head -c4)
          NUM=$(tr -dc '0-9' < /dev/urandom 2>/dev/null | head -c4)
          SPECIAL=$(tr -dc '!@#$%^&*' < /dev/urandom 2>/dev/null | head -c4)
          PASSWORD=$(echo "$UPPER$LOWER$NUM$SPECIAL" | fold -w1 | shuf | tr -d '\n')

          sudo useradd -m -s /bin/bash RDP
          echo "RDP:$PASSWORD" | sudo chpasswd
          sudo usermod -aG sudo RDP

          echo "RDP_CREDS=User: RDP | Password: $PASSWORD" >> "$GITHUB_ENV"

          echo "RDP user created."

      - name: Install Visual Studio Code
        run: |
          wget -q https://go.microsoft.com/fwlink/?LinkID=760868 -O /tmp/vscode.deb
          sudo apt-get install -y /tmp/vscode.deb
          rm -f /tmp/vscode.deb

          which code || { echo "VS Code install failed"; exit 1; }
          echo "VS Code installed."

      - name: Install Tailscale
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh
          echo "Tailscale installed."

      - name: Establish Tailscale Connection
        run: |
          sudo tailscale up \
            --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} \
            --hostname=gh-runner-linux-$GITHUB_RUN_ID

          TS_IP=""
          for i in $(seq 1 20); do
            TS_IP=$(tailscale ip -4 2>/dev/null | head -n1)
            [ -n "$TS_IP" ] && break
            echo "Waiting for Tailscale IP..."
            sleep 5
          done

          if [ -z "$TS_IP" ]; then
            echo "Tailscale IP was not assigned."
            exit 1
          fi

          echo "TAILSCALE_IP=$TS_IP" >> "$GITHUB_ENV"
          echo "Tailscale IP: $TS_IP"

      - name: Verify RDP Accessibility
        run: |
          sudo apt-get install -y netcat-openbsd
          if ! nc -z -w5 "$TAILSCALE_IP" 3389; then
            echo "TCP connection to RDP port 3389 failed."
            exit 1
          fi
          echo "RDP TCP connectivity successful!"

      - name: Show Access Information
        run: |
          echo ""
          echo "=========================================="
          echo " RDP ACCESS"
          echo "=========================================="
          echo "Address: $TAILSCALE_IP"
          echo "Username: RDP"
          echo "Password: $RDP_CREDS"
          echo "=========================================="
          echo ""
          echo "Visual Studio Code is installed."
          echo "=========================================="

      - name: Maintain Connection
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOW=$(date +%s)
          HANDOVER_AT=$(( NOW + 310*60 ))
          END_AT=$(( NOW + 335*60 ))

          # Phase 1: keep the session alive
          while [ "$(date +%s)" -lt "$HANDOVER_AT" ] && [ "$(date +%s)" -lt "$DEADLINE" ]; do
            echo "[$(date)] RDP Active - Runner is alive"
            sleep 300
          done

          NOW=$(date +%s)

          if [ "$NOW" -ge "$(( DEADLINE - 600 ))" ]; then
            echo "24h deadline reached. Not starting a new runner."
            exit 0
          fi

          # Phase 2: start the next runner
          echo "Starting next runner..."

          gh workflow run mika-linux.yml \
            --repo ${{ github.repository }} \
            --ref ${{ github.ref_name }} \
            -f deadline=$DEADLINE || echo "Failed to start next runner."

          # Phase 3: overlap so you have time to switch over
          while [ "$(date +%s)" -lt "$END_AT" ] && [ "$(date +%s)" -lt "$DEADLINE" ]; do
            echo "[$(date)] Handover - this runner is about to end"
            sleep 60
          done
