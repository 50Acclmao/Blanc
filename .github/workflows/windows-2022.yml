name: RDP-1

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-2022
    timeout-minutes: 3600

    steps:
      - name: Configure Core RDP Settings
        run: |
          # Enable Remote Desktop
          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name "fDenyTSConnections" `
            -Value 0 `
            -Force

          # Disable Network Level Authentication
          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name "UserAuthentication" `
            -Value 0 `
            -Force

          # Set RDP security layer
          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name "SecurityLayer" `
            -Value 0 `
            -Force

          # Remove old firewall rule if it exists
          netsh advfirewall firewall delete rule name="RDP-Tailscale"

          # Allow RDP on port 3389
          netsh advfirewall firewall add rule `
            name="RDP-Tailscale" `
            dir=in `
            action=allow `
            protocol=TCP `
            localport=3389

          # Restart Remote Desktop service
          Restart-Service -Name TermService -Force

          Write-Host "RDP configured successfully."

      - name: Lighten Windows
        run: |
          # High performance power plan
          try { powercfg /setactive SCHEME_MIN } catch {}

          # Turn off Defender real-time scanning
          try { Set-MpPreference -DisableRealtimeMonitoring $true } catch {}

          # Stop and disable heavy background services
          $services = @("WSearch", "wuauserv", "UsoSvc", "SysMain", "DiagTrack", "DoSvc", "MapsBroker")
          foreach ($svc in $services) {
            try {
              Stop-Service -Name $svc -Force -ErrorAction SilentlyContinue
              Set-Service -Name $svc -StartupType Disabled -ErrorAction SilentlyContinue
            } catch {}
          }

          # RDP side: no wallpaper, 16-bit color
          try {
            $ts = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
            if (-not (Test-Path $ts)) { New-Item -Path $ts -Force | Out-Null }
            Set-ItemProperty -Path $ts -Name "fNoRemoteDesktopWallpaper" -Value 1 -Type DWord -Force
            Set-ItemProperty -Path $ts -Name "ColorDepth" -Value 3 -Type DWord -Force
          } catch {}

          # Best performance visual settings for new users (applies to the RDP user)
          try {
            reg load HKU\DefUser C:\Users\Default\NTUSER.DAT
            reg add "HKU\DefUser\Software\Microsoft\Windows\CurrentVersion\Explorer\VisualEffects" /v VisualFXSetting /t REG_DWORD /d 2 /f
            reg add "HKU\DefUser\Control Panel\Desktop" /v UserPreferencesMask /t REG_BINARY /d 9012038010000000 /f
            reg add "HKU\DefUser\Control Panel\Desktop" /v DragFullWindows /t REG_SZ /d 0 /f
            reg add "HKU\DefUser\Control Panel\Desktop\WindowMetrics" /v MinAnimate /t REG_SZ /d 0 /f
            reg add "HKU\DefUser\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize" /v EnableTransparency /t REG_DWORD /d 0 /f
            reg add "HKU\DefUser\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced" /v TaskbarAnimations /t REG_DWORD /d 0 /f
            [gc]::Collect()
            Start-Sleep -Seconds 2
            reg unload HKU\DefUser
          } catch {}

          Write-Host "Windows lightened."

      - name: Create RDP User with Secure Password
        run: |
          Add-Type -AssemblyName System.Security

          $charSet = @{
            Upper = [char[]](65..90)
            Lower = [char[]](97..122)
            Number = [char[]](48..57)
            Special = (
              [char[]](33..47) +
              [char[]](58..64) +
              [char[]](91..96) +
              [char[]](123..126)
            )
          }

          $rawPassword = @()
          $rawPassword += $charSet.Upper | Get-Random -Count 4
          $rawPassword += $charSet.Lower | Get-Random -Count 4
          $rawPassword += $charSet.Number | Get-Random -Count 4
          $rawPassword += $charSet.Special | Get-Random -Count 4

          $password = -join ($rawPassword | Sort-Object { Get-Random })

          $securePass = ConvertTo-SecureString `
            $password `
            -AsPlainText `
            -Force

          # Remove existing user if present
          if (Get-LocalUser -Name "RDP" -ErrorAction SilentlyContinue) {
            Remove-LocalUser -Name "RDP"
          }

          # Create RDP account
          New-LocalUser `
            -Name "RDP" `
            -Password $securePass `
            -AccountNeverExpires `
            -PasswordNeverExpires

          # Add required groups
          Add-LocalGroupMember `
            -Group "Administrators" `
            -Member "RDP"

          Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member "RDP"

          # Store credentials in environment
          "RDP_CREDS=User: RDP | Password: $password" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append `
              -Encoding utf8

          # Verify user creation
          if (-not (Get-LocalUser -Name "RDP" -ErrorAction SilentlyContinue)) {
            Write-Error "User creation failed"
            exit 1
          }

          Write-Host "RDP user created successfully."

      - name: Install Visual Studio Code
        run: |
          Write-Host "Installing Visual Studio Code..."

          $url = "https://update.code.visualstudio.com/latest/win32-x64-user/stable"
          $installer = "$env:TEMP\vscode.exe"

          Invoke-WebRequest `
            -Uri $url `
            -OutFile $installer

          if (-not (Test-Path $installer)) {
            Write-Error "VS Code installer was not downloaded."
            exit 1
          }

          Start-Process `
            -FilePath $installer `
            -ArgumentList "/VERYSILENT", "/NORESTART", "/MERGETASKS=!runcode" `
            -Wait

          Remove-Item $installer -Force -ErrorAction SilentlyContinue

          # Check common installation paths
          $vscodePaths = @(
            "$env:LOCALAPPDATA\Programs\Microsoft VS Code\Code.exe",
            "$env:ProgramFiles\Microsoft VS Code\Code.exe"
          )

          $installed = $false

          foreach ($path in $vscodePaths) {
            if (Test-Path $path) {
              Write-Host "VS Code installed at: $path"
              $installed = $true
              break
            }
          }

          if (-not $installed) {
            Write-Error "VS Code installation could not be verified."
            exit 1
          }

          Write-Host "Visual Studio Code installed successfully."

      - name: Install Tailscale
        run: |
          Write-Host "Installing Tailscale..."

          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $installerPath = "$env:TEMP\tailscale.msi"

          Invoke-WebRequest `
            -Uri $tsUrl `
            -OutFile $installerPath

          Start-Process `
            -FilePath "msiexec.exe" `
            -ArgumentList "/i", "`"$installerPath`"", "/quiet", "/norestart" `
            -Wait

          Remove-Item $installerPath -Force

          if (-not (Test-Path "$env:ProgramFiles\Tailscale\tailscale.exe")) {
            Write-Error "Tailscale installation failed."
            exit 1
          }

          Write-Host "Tailscale installed successfully."

      - name: Establish Tailscale Connection
        run: |
          Write-Host "Connecting to Tailscale..."

          $tailscale = "$env:ProgramFiles\Tailscale\tailscale.exe"

          & $tailscale up `
            --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} `
            --hostname=gh-runner-$env:GITHUB_RUN_ID

          if ($LASTEXITCODE -ne 0) {
            Write-Error "Tailscale connection failed."
            exit 1
          }

          # Wait for Tailscale IPv4 address
          $tsIP = $null
          $retries = 0

          while (-not $tsIP -and $retries -lt 20) {
            $tsIP = (& $tailscale ip -4 2>$null | Select-Object -First 1).Trim()

            if ($tsIP) {
              break
            }

            Write-Host "Waiting for Tailscale IP..."
            Start-Sleep -Seconds 5
            $retries++
          }

          if (-not $tsIP) {
            Write-Error "Tailscale IP was not assigned."
            exit 1
          }

          "TAILSCALE_IP=$tsIP" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append `
              -Encoding utf8

          Write-Host "Tailscale IP: $tsIP"

      - name: Verify RDP Accessibility
        run: |
          Write-Host "Testing RDP connectivity..."
          Write-Host "Tailscale IP: $env:TAILSCALE_IP"

          $testResult = Test-NetConnection `
            -ComputerName $env:TAILSCALE_IP `
            -Port 3389 `
            -WarningAction SilentlyContinue

          if (-not $testResult.TcpTestSucceeded) {
            Write-Error "TCP connection to RDP port 3389 failed."
            exit 1
          }

          Write-Host "RDP TCP connectivity successful!"

      - name: Show Access Information
        run: |
          Write-Host ""
          Write-Host "=========================================="
          Write-Host " RDP ACCESS"
          Write-Host "=========================================="
          Write-Host "Address: $env:TAILSCALE_IP"
          Write-Host "Username: RDP"
          Write-Host "Password: $($env:RDP_CREDS)"
          Write-Host "=========================================="
          Write-Host ""
          Write-Host "Visual Studio Code is installed."
          Write-Host "=========================================="

      - name: Maintain Connection
        run: |
          while ($true) {
            Write-Host "[$(Get-Date)] RDP Active - Runner is alive"
            Start-Sleep -Seconds 300
          }
