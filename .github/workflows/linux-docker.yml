name: RDP-Linux-Docker-1

on:
  workflow_dispatch:
    inputs:
      password:
        description: "RDP password (leave empty for a random one)"
        required: false
        default: ""
      deadline:
        description: "Leave empty. Used by auto-restart to keep the 24h deadline"
        required: false
        default: ""

permissions:
  actions: write
  contents: read

jobs:
  secure-rdp:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Set 24h Deadline
        run: |
          DEADLINE="${{ github.event.inputs.deadline }}"

          if [ -z "$DEADLINE" ]; then
            DEADLINE=$(( $(date +%s) + 86400 ))
          fi

          echo "DEADLINE=$DEADLINE" >> "$GITHUB_ENV"
          echo "Session deadline: $(date -u -d @$DEADLINE)"

      - name: Set RDP Password
        run: |
          PASSWORD="${{ github.event.inputs.password }}"

          if [ -z "$PASSWORD" ]; then
            UPPER=$(tr -dc 'A-Z' < /dev/urandom 2>/dev/null | head -c4)
            LOWER=$(tr -dc 'a-z' < /dev/urandom 2>/dev/null | head -c4)
            NUM=$(tr -dc '0-9' < /dev/urandom 2>/dev/null | head -c4)
            SPECIAL=$(tr -dc '!@#$%^&*' < /dev/urandom 2>/dev/null | head -c4)
            PASSWORD=$(echo "$UPPER$LOWER$NUM$SPECIAL" | fold -w1 | shuf | tr -d '\n')
          fi

          echo "RDP_PASSWORD=$PASSWORD" >> "$GITHUB_ENV"

      - name: Write Dockerfile
        run: |
          mkdir -p rdp-docker
          cd rdp-docker

          {
            echo 'FROM debian:bookworm'
            echo ''
            echo 'RUN apt update && \'
            echo '    DEBIAN_FRONTEND=noninteractive apt install -y \'
            echo '    xrdp xfce4 xfce4-terminal xfce4-goodies dbus-x11 \'
            echo '    sudo wget curl git firefox-esr fonts-wqy-zenhei gpg && \'
            echo '    rm -rf /var/lib/apt/lists/*'
            echo ''
            echo 'RUN wget -q https://go.microsoft.com/fwlink/?LinkID=760868 -O /tmp/vscode.deb && \'
            echo '    apt install -y /tmp/vscode.deb && rm -f /tmp/vscode.deb'
            echo ''
            echo 'RUN useradd -m -s /bin/bash RDP && \'
            echo '    adduser RDP sudo && \'
            echo '    adduser xrdp ssl-cert'
            echo ''
            echo 'RUN echo "xfce4-session" > /home/RDP/.xsession && \'
            echo '    chown RDP:RDP /home/RDP/.xsession'
            echo ''
            echo 'RUN printf "#!/bin/sh\nexec /bin/dbus-launch --exit-with-session xfce4-session\n" > /etc/xrdp/startwm.sh && \'
            echo '    chmod +x /etc/xrdp/startwm.sh'
            echo ''
            echo 'EXPOSE 3389'
            echo 'CMD service xrdp start && tail -f /var/log/xrdp.log'
          } > Dockerfile

          cat Dockerfile

      - name: Build Image
        run: docker build -t rdp-linux ./rdp-docker

      - name: Run Container
        run: |
          docker run -d \
            -p 3389:3389 \
            -v rdp-home:/home/RDP \
            --name rdp-linux \
            rdp-linux

          echo "RDP:$RDP_PASSWORD" | docker exec -i rdp-linux chpasswd

          sleep 3
          docker ps

      - name: Install Tailscale
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh
          echo "Tailscale installed."

      - name: Establish Tailscale Connection
        run: |
          sudo tailscale up \
            --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} \
            --hostname=gh-runner-docker-$GITHUB_RUN_ID

          TS_IP=""
          for i in $(seq 1 20); do
            TS_IP=$(tailscale ip -4 2>/dev/null | head -n1)
            [ -n "$TS_IP" ] && break
            echo "Waiting for Tailscale IP..."
            sleep 5
          done

          if [ -z "$TS_IP" ]; then
            echo "Tailscale IP was not assigned."
            exit 1
          fi

          echo "TAILSCALE_IP=$TS_IP" >> "$GITHUB_ENV"
          echo "Tailscale IP: $TS_IP"

      - name: Verify RDP Accessibility
        run: |
          sudo apt-get install -y netcat-openbsd
          if ! nc -z -w5 "$TAILSCALE_IP" 3389; then
            echo "TCP connection to RDP port 3389 failed."
            exit 1
          fi
          echo "RDP TCP connectivity successful!"

      - name: Show Access Information
        run: |
          echo ""
          echo "=========================================="
          echo " RDP ACCESS"
          echo "=========================================="
          echo "Address: $TAILSCALE_IP"
          echo "Username: RDP"
          echo "Password: $RDP_PASSWORD"
          echo "=========================================="
          echo ""
          echo "Visual Studio Code is installed."
          echo "=========================================="

      - name: Maintain Connection
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOW=$(date +%s)
          HANDOVER_AT=$(( NOW + 310*60 ))
          END_AT=$(( NOW + 335*60 ))

          while [ "$(date +%s)" -lt "$HANDOVER_AT" ] && [ "$(date +%s)" -lt "$DEADLINE" ]; do
            echo "[$(date)] RDP Active - Runner is alive"
            sleep 300
          done

          NOW=$(date +%s)

          if [ "$NOW" -ge "$(( DEADLINE - 600 ))" ]; then
            echo "24h deadline reached. Not starting a new runner."
            exit 0
          fi

          echo "Starting next runner..."

          gh workflow run mika-linux-docker.yml \
            --repo ${{ github.repository }} \
            --ref ${{ github.ref_name }} \
            -f deadline=$DEADLINE \
            -f password="$RDP_PASSWORD" || echo "Failed to start next runner."

          while [ "$(date +%s)" -lt "$END_AT" ] && [ "$(date +%s)" -lt "$DEADLINE" ]; do
            echo "[$(date)] Handover - this runner is about to end"
            sleep 60
          done
